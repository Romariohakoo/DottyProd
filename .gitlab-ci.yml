stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: registry.spirit.t-education.com/${CI_PROJECT_ROOT_NAMESPACE}
  FRONTEND_IMAGE_NAME: ${REGISTRY}/${CI_PROJECT_NAME}_frontend:${CI_COMMIT_SHORT_SHA}
  BACKEND_IMAGE_NAME: ${REGISTRY}/${CI_PROJECT_NAME}_backend:${CI_COMMIT_SHORT_SHA}
  VM: ubuntu@158.160.134.165

# 1. ТЕСТЫ БЭКЕНДА
test_backend:
  stage: test
  image: python:3.14-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
      entrypoint: ["sh", "-c"]
      command: ["export POSTGRES_USER=test POSTGRES_PASSWORD=test POSTGRES_DB=test; exec docker-entrypoint.sh postgres"]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
  script:
    - cd backend
    - pip install -q -r requirements.txt
    - PYTEST_USE_TESTCONTAINERS=0 POSTGRES_HOST=postgres POSTGRES_PORT=5432
      POSTGRES_USERNAME=test POSTGRES_PASSWORD=test POSTGRES_DATABASE=test
      SECRET_KEY=ci-test-secret python -m pytest -q

# 2. СБОРКА DOCKER-ОБРАЗОВ
.kaniko_build:
  stage: build
  image: registry.spirit.t-education.com/cicd-images/base-kaniko:latest
  before_script:
    - dp auth service-acc --key-file "$SPIRIT_DOCKER_SA_KEY"
    - dp auth configure-kaniko
  script:
    - executor --dockerfile "$CONTEXT/Dockerfile" --context "$CONTEXT" --destination "$IMAGE" --cache=true --skip-push-permission-check || true

build_frontend:
  extends: .kaniko_build
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    IMAGE: $FRONTEND_IMAGE_NAME
  script:
    - if [ -n "${FRONTEND_ENV:-}" ]; then cp "$FRONTEND_ENV" "$CONTEXT/.env" 2>/dev/null || printf '%s\n' "$FRONTEND_ENV" > "$CONTEXT/.env"; fi
    - cp "$(command -v dp)" "$CI_PROJECT_DIR/dp"
    - !reference [.kaniko_build, script]
  artifacts:
    paths: [dp]
    expire_in: 1 day

build_backend:
  extends: .kaniko_build
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    IMAGE: $BACKEND_IMAGE_NAME

# 3. ДЕПЛОЙ НА ВИРТУАЛКУ
deploy:
  stage: deploy
  image: kroniak/ssh-client:3.19
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: build_frontend
      artifacts: true
    - job: build_backend
      artifacts: false
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 400 ~/.ssh/id_rsa
    - printf "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - printf '\nTELEGRAM_BOT_TOKEN=%s\nTELEGRAM_NOTIFICATIONS_ENABLED=true\nFRONTEND_IMAGE_NAME=%s\nBACKEND_IMAGE_NAME=%s\n' "${TELEGRAM_BOT_TOKEN:-}" "$FRONTEND_IMAGE_NAME" "$BACKEND_IMAGE_NAME" >> "$BACKEND_ENV"
    - ssh $VM "mkdir -p ~/app && rm -rf ~/app/monitoring"
    - scp -r deploy/docker-compose.yaml deploy/nginx.conf deploy/Caddyfile deploy/monitoring "$SPIRIT_DOCKER_SA_KEY" $VM:~/app/
    - scp "$BACKEND_ENV" $VM:~/app/.env
    - if [ -n "${FRONTEND_ENV:-}" ] && [ -f "$FRONTEND_ENV" ]; then scp "$FRONTEND_ENV" $VM:~/app/frontend.env; else ssh $VM "touch ~/app/frontend.env"; fi
    - scp dp $VM:/tmp/dp
    - |
      ssh $VM "
        sudo mv /tmp/dp /usr/local/bin/dp && sudo chmod +x /usr/local/bin/dp &&
        cd ~/app &&
        [ -f grafana.env ] || echo GF_SECURITY_ADMIN_PASSWORD=\$(openssl rand -hex 12) > grafana.env &&
        sudo dp auth service-acc --key-file $(basename "$SPIRIT_DOCKER_SA_KEY") &&
        sudo dp auth configure-docker &&
        sudo docker compose pull &&
        sudo docker compose up -d --force-recreate --remove-orphans &&
        sudo docker compose exec -T nginx nginx -s reload
      "