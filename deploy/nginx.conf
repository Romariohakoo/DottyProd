# Docker DNS. Без переменной в proxy_pass nginx запоминает IP контейнера
# на старте, и после пересоздания backend весь /api отвечает 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  location = /api/auth/telegram/callback {
      access_log off;
      set $backend_upstream backend:1984;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api {
      client_max_body_size 11m;
      set $backend_upstream backend:1984;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /grafana/api/live/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /grafana/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
      set $frontend_upstream frontend:3000;
      proxy_pass http://$frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }
}
